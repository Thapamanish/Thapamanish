name: Generate contribution snake

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate light and dark snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%237c9cff&color_dots=%23eef2ff,%23c7d2fe,%239db0ff,%237c9cff,%235eead4
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23ffb86b&color_dots=%23232c55,%232c3b6e,%235571be,%237c9cff,%235eead4

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
