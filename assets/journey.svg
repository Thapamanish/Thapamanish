<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
  <title id="title">Manish Thapa&#x27;s animated career journey</title>
  <desc id="desc">A moving dot travels from Kathmandu to Target, San Diego State University, Google X the Moonshot Factory, and the next chapter.</desc>
  <rect width="900" height="220" rx="20" fill="#0b1020"/>
  <rect x="1" y="1" width="898" height="218" rx="19" fill="#111936" stroke="#232c55" stroke-width="2"/>
  <text x="32" y="38" fill="#8b95b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="14">journey.log</text>
  <path d="M92 124 C154 58 215 58 277 92 S400 158 462 124 S585 58 647 92 S770 158 832 124" fill="none" stroke="#232c55" stroke-width="5" stroke-linecap="round"/>
  <path d="M92 124 C154 58 215 58 277 92 S400 158 462 124 S585 58 647 92 S770 158 832 124" fill="none" stroke="#7c9cff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Kathmandu / Nepal flag: inline vector geometry -->
  <g transform="translate(72 104)">
    <path d="M0 0 L24 10 L0 20 L24 31 L0 42 Z" fill="#dc143c" stroke="#e8ecf8" stroke-width="1.5"/>
    <circle cx="8" cy="13" r="3" fill="#e8ecf8"/>
    <circle cx="8" cy="31" r="3" fill="#e8ecf8"/>
  </g>
  <text x="92" y="171" text-anchor="middle" fill="#e8ecf8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700">NEPAL</text>
  <text x="92" y="191" text-anchor="middle" fill="#8b95b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="12">origin</text>

  <!-- Target bullseye: inline vector geometry -->
  <g transform="translate(277 92)">
    <circle r="21" fill="#cc0000"/>
    <circle r="12" fill="#111936"/>
    <circle r="5" fill="#cc0000"/>
  </g>
  <text x="277" y="53" text-anchor="middle" fill="#e8ecf8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700">TARGET</text>
  <text x="277" y="72" text-anchor="middle" fill="#8b95b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="12">backend systems</text>

  <!-- SDSU: a clean custom vector S lettermark, not an official Aztec mark -->
  <g transform="translate(442 104)">
    <rect width="40" height="40" rx="8" fill="#c41230"/>
    <path d="M28 10 H14 C10 10 9 14 13 16 L24 20 C29 22 28 30 23 30 H11" fill="none" stroke="#e8ecf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="462" y="171" text-anchor="middle" fill="#e8ecf8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700">SDSU</text>
  <text x="462" y="191" text-anchor="middle" fill="#8b95b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="12">MS CS · Aug 2027</text>

  <!-- Clean inline Google wordmark; no external image dependency -->
  <text x="647" y="103" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" letter-spacing="-1.5"><tspan fill="#4285f4">G</tspan><tspan fill="#ea4335">o</tspan><tspan fill="#fbbc05">o</tspan><tspan fill="#4285f4">g</tspan><tspan fill="#34a853">l</tspan><tspan fill="#ea4335">e</tspan></text>
  <text x="647" y="171" text-anchor="middle" fill="#e8ecf8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700">GOOGLE X</text>
  <text x="647" y="191" text-anchor="middle" fill="#8b95b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="12">the Moonshot Factory</text>

  <g transform="translate(812 104)">
    <circle cx="20" cy="20" r="19" fill="none" stroke="#5eead4" stroke-width="3" stroke-dasharray="4 5"/>
    <path d="M16 15 C16 9 25 9 25 15 C25 20 20 20 20 25 M20 32 L20 32" fill="none" stroke="#ffb86b" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="832" y="171" text-anchor="middle" fill="#e8ecf8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700">NEXT</text>
  <text x="832" y="191" text-anchor="middle" fill="#8b95b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="12">keep building</text>

  <circle r="9" fill="#ffb86b" stroke="#0b1020" stroke-width="4">
    <animate attributeName="cx" values="92;277;462;647;832;832;92" keyTimes="0;0.18;0.36;0.54;0.72;0.86;1" dur="12s" repeatCount="indefinite" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.42 0 .58 1"/>
    <animate attributeName="cy" values="124;92;124;92;124;124;124" keyTimes="0;0.18;0.36;0.54;0.72;0.86;1" dur="12s" repeatCount="indefinite" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.42 0 .58 1"/>
  </circle>
</svg>
